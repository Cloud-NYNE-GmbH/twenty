# NYNE fork: build the custom Twenty image (with generic OIDC login) on every
# push to the `nyne` deploy branch, publish it to GHCR, and trigger the generic
# deploy workflow in the intranet-deploy repo.
#
# This file is NYNE-specific and additive — it does not exist upstream, so it
# never conflicts when rebasing `nyne` onto a newer upstream tag.
#
# Branching model:
#   main  -> tracks upstream twentyhq/twenty (for clean rebases, never built)
#   nyne  -> upstream release tag + NYNE patches; this is what we deploy
#
# Shared deploy contract (locked across all stacks routed by intranet-deploy):
#   event-type:     deploy-stack
#   client-payload: { "stack": "<stack-name>", "tag": "<image-tag>" }
# For this repo: stack = "twenty", tag = the git SHA we just built/pushed.
#
# REQUIRED SECRET: INTRANET_DEPLOY_PAT
# ----------------------------------------------------------------------
# The dispatch step calls into a different repository
# (Cloud-NYNE-GmbH/intranet-deploy), so the default GITHUB_TOKEN is not
# sufficient. Create a fine-grained Personal Access Token with
# "repository_dispatch: write" (or classic PAT with `repo` scope) limited
# to the intranet-deploy repo, and add it to this repo's secrets as
# INTRANET_DEPLOY_PAT. Until that secret is configured the dispatch job
# logs a clear warning and exits successfully — image builds always run
# and the secret can be added later without changing this workflow.

name: nyne-build-and-deploy

on:
  push:
    branches: [nyne]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: cloud-nyne-gmbh
  IMAGE_NAME: twenty

jobs:
  build:
    name: build-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The single Twenty image bundles twenty-front (static) + twenty-server.
      # Build context is the repo root; the Dockerfile lives under twenty-docker.
      #
      # MEMORY: the twenty-front build is memory-hungry — the Dockerfile runs it
      # with --max-old-space-size=8192, which can OOM on the 7 GB `ubuntu-latest`
      # runner. If the first build fails with an OOM/heap error, either move to a
      # larger runner (e.g. a 16 GB GitHub larger runner / self-hosted) or
      # pre-build the front on the runner into packages/twenty-front/build/
      # before this step (the Dockerfile detects and reuses that directory).
      - name: Build and push ${{ env.IMAGE_NAME }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=twenty
          cache-to: type=gha,mode=max,scope=twenty

  dispatch:
    name: dispatch-deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check INTRANET_DEPLOY_PAT secret
        id: check-secret
        env:
          PAT: ${{ secrets.INTRANET_DEPLOY_PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::warning::INTRANET_DEPLOY_PAT is not configured." \
              "Skipping cross-repo dispatch to Cloud-NYNE-GmbH/intranet-deploy." \
              "Add a PAT with repo scope on the intranet-deploy repo to this" \
              "repo's secrets (name: INTRANET_DEPLOY_PAT) to enable auto-deploy."
            echo "has_pat=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_pat=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger intranet-deploy
        if: steps.check-secret.outputs.has_pat == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INTRANET_DEPLOY_PAT }}
          repository: Cloud-NYNE-GmbH/intranet-deploy
          event-type: deploy-stack
          client-payload: |
            {
              "stack": "twenty",
              "tag": "${{ github.sha }}"
            }
